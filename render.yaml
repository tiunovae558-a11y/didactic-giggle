services:
  - type: worker
    name: protivzla-ultimate
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: SUPPORT_USERNAME
        value: "@suqexo"
      - key: DB_PATH
        value: "/var/data/protivzla.db"
      - key: BROADCAST_DELAY
        value: "0.08"
